name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签版本（例如 v0.1.0）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Installing android-36 and build-tools..."
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build Release APK
        run: |
          cd HuihutongGate
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          cd HuihutongGate

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing required KEYSTORE_BASE64 release secret"
            exit 1
          fi

          echo "Using release keystore from GitHub Secrets..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'huihutong123' }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS || 'huihutong' }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD || 'huihutong123' }}"

          # 寻找最新的 apksigner 工具
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          # 对打包出的 APK 进行签名
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $APKSIGNER sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out ../HuiHuTong-Gate.apk "$RAW_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuiHuTong-Gate-APK
          path: HuiHuTong-Gate.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          fi

          echo "Publishing release for tag: $TAG"

          gh release create "$TAG" HuiHuTong-Gate.apk \
            --title "HuiHuTong $TAG" \
            --generate-notes || \
          gh release upload "$TAG" HuiHuTong-Gate.apk --clobber
